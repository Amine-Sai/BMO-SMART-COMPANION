# Mosquitto MQTT Broker Configuration for BMO
#
# Install mosquitto:
#   Debian / Ubuntu / Raspberry Pi OS:
#     sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients
#
# Password setup:
#   Mosquitto requires hashed passwords in the password file.
#   1. Initialize a new password file with initial user (e.g. cv):
#        mosquitto_passwd -c infra/passwords cv
#   2. Add additional users:
#        mosquitto_passwd infra/passwords brain
#        mosquitto_passwd infra/passwords pi
#        mosquitto_passwd infra/passwords esp32
#   Or generate from infra/passwords.example:
#        cp infra/passwords.example infra/passwords
#        mosquitto_passwd -U infra/passwords
#
# ACL setup:
#   Generate the ACL file using tools/gen_acl.py:
#     python -m tools.gen_acl

listener 1883 0.0.0.0
allow_anonymous false
password_file infra/passwords
acl_file infra/acl
