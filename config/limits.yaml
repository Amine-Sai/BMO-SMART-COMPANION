# PLACEHOLDER physical limits until confirmed by human (H3)
emotions:
  - neutral
  - happy
  - sad
  - thinking
  - surprised
  - sleepy
  - wink
  - error
  - angry
  - mad
  - annoyed
  - playful
  - love
  - kiss
  - excited
  - amazed
  - terrified
  - empathetic
servos:
  pan:
    min_deg: -60.0
    max_deg: 60.0
    boot_deg: 0.0
  tilt:
    min_deg: -30.0
    max_deg: 45.0
    boot_deg: 0.0
  left_arm:
    min_deg: 0.0
    max_deg: 120.0
    boot_deg: 0.0
  right_arm:
    min_deg: 0.0
    max_deg: 120.0
    boot_deg: 0.0
rate_limits:
  min_interval_s: 0.25
  max_deg_per_sec: 90.0
  watchdog_timeout_ms: 3000
sounds:
  - chime
  - beep
  - confirm
  - error
  - wake
  - purr
